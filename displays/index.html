<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- the display list moved into the all-category finder; keep the old link alive -->
  <meta http-equiv="refresh" content="0; url=../products/?cat=displays" />
  <link rel="canonical" href="https://osptek.github.io/products/?cat=displays" />
  <title>Find a Product — OSPTEK</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <p><a href="../products/?cat=displays">Display modules moved to /products/</a></p>
  <script>
    // carry a bookmarked search or filter over to the new address
    (() => {
      const p = new URLSearchParams(location.search);
      p.set('cat', 'displays');
      location.replace('../products/?' + p);
    })();
  </script>
</body>
</html>
