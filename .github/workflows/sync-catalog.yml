name: Sync product catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-sync]

permissions:
  contents: write

concurrency:
  group: sync-product-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: python -m pip install PyYAML

      - name: Build catalog from GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-catalog.py --source github

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- products/catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/catalog.json
          git commit -m "chore(catalog): sync product metadata"
          git push
