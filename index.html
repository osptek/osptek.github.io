<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSPTEK</title>
  <meta name="description" content="OSPTEK product documentation" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/base.css?v=2" />
  <link rel="stylesheet" href="assets/home.css?v=35" />
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="OSPTEK">osptek</a>
    <button class="menu" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>
  <main class="hero">
    <div class="mark-wrap">
      <div class="mark-color" aria-hidden="true"></div>
      <img class="mark" src="assets/mark.svg" alt="" draggable="false" />
      <div class="mark-glow" aria-hidden="true">
        <i class="orbit"></i>
      </div>
      <!-- click target: the mark shape itself, with a little slack around the edges -->
      <svg class="mark-hit" viewBox="10 240 840 440" aria-hidden="true">
        <g fill="none" stroke="none" stroke-width="44" stroke-linejoin="round">
          <polygon points="20,446 239,405 393,622" />
          <polygon points="211,657 488,320 837,257" />
        </g>
      </svg>
    </div>
    <h1 class="title">Embedded<br />Hardware</h1>
    <p class="sub">
      <span class="rotator">
        <span class="phrase">Built for Development</span>
        <span class="phrase">From Module to System</span>
        <span class="phrase">Made for Integration</span>
        <span class="phrase">Hardware for Engineers</span>
        <span class="phrase">Ready for Prototyping</span>
        <span class="phrase">From Prototype to Product</span>
      </span>
    </p>
    <div class="actions">
      <a class="btn btn-fill" href="products/">Find a Display</a>
      <a class="btn btn-ghost" href="https://github.com/osptek" target="_blank" rel="noopener">Browse Repositories</a>
    </div>
  </main>

  <!-- the count and range are placeholders: home.js refreshes them from products/catalog.json -->
  <section class="cats-home" aria-labelledby="cats-title">
    <h2 class="sr-only" id="cats-title">Product categories</h2>
    <div class="cat-grid">
      <a class="cat-card" href="products/">
        <span class="cat-head">
          <span class="cat-name">Displays</span>
          <span class="cat-count">382</span>
        </span>
        <span class="cat-note">TFT · AMOLED · RLCD · EPD · OLED, <span class="cat-range">0.42" to 13.3"</span></span>
      </a>
    </div>
  </section>
  <script src="assets/topbar.js?v=1"></script>
  <script src="assets/home.js?v=14"></script>
</body>
</html>
